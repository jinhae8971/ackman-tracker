# 13D/G · Form 3/4 신규 감지 (준실시간 채널) — 3사 공통.
#
# 13F 는 45일 지연이지만 SC 13D 는 취득 후 5영업일(정정 2영업일),
# Form 4 는 거래 후 2영업일 내 제출된다. 이 워크플로우는 신규 제출을 감지해
# GitHub Issue 로 알린다 — 별도 알림 인프라 없이 GitHub 자체 알림을 재사용한다.
#
# 감지만 하고 파싱은 하지 않는다(13D 파싱은 백로그 T7). 따라서 무결성 게이트
# 대상이 아니며, 중복 알림 방지를 위해 data/state/{entity}.json 의 `alerted`
# 집합만 갱신한다.
#
# 폼 타입 표기가 두 가지인 이유
# -----------------------------
# EDGAR 는 같은 서식을 시기에 따라 "SC 13G" 와 "SCHEDULE 13G" 로 달리 적는다.
# 실제 데이터에 두 표기가 모두 존재하고(Citadel: SC 13G/A 775건 + SCHEDULE 13G/A
# 52건), run.py 의 필터는 정확 문자열 일치이므로 한쪽만 넣으면 나머지를 통째로
# 놓친다. 기본값에 두 표기를 모두 넣는다.
name: poll-daily

on:
  schedule:
    # 평일 UTC 22:00 = 미 동부 장마감(21:00 UTC, 서머타임 20:00 UTC) 이후
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      entities:
        description: "처리할 엔티티 (공백 구분). 비우면 전체"
        type: string
        default: ""
      forms:
        description: "감지할 폼 타입 (쉼표 구분)"
        type: string
        default: "SC 13D,SC 13D/A,SC 13G,SC 13G/A,SCHEDULE 13D,SCHEDULE 13D/A,SCHEDULE 13G,SCHEDULE 13G/A,3,4"
      alert_window_days:
        description: "알림 최근성 창(일). 0 이면 창 없음"
        type: string
        default: "14"

permissions:
  contents: write   # data/state/{entity}.json 커밋
  issues: write     # 신규 공시 / 실패 알림

# fetch-13f 와 같은 그룹 — 두 워크플로우가 동시에 push 하지 않도록 직렬화한다.
concurrency:
  group: ackman-tracker-data
  cancel-in-progress: false

env:
  SEC_USER_AGENT: "AckmanTracker younggil jinhae8971@gmail.com"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  ALL_ENTITIES: "pershing berkshire citadel"
  DEFAULT_FORMS: "SC 13D,SC 13D/A,SC 13G,SC 13G/A,SCHEDULE 13D,SCHEDULE 13D/A,SCHEDULE 13G,SCHEDULE 13G/A,3,4"

jobs:
  poll:
    runs-on: ubuntu-latest
    # submissions JSON 한 번씩만 받는다. 3사라도 1분 남짓.
    timeout-minutes: 30
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: python -m pip install --upgrade pip requests

      # fetch-13f 와 같은 이유로 매트릭스가 아닌 순차 루프다(그쪽 주석 참고).
      # 신규 엔티티는 상태 파일이 없어 첫 실행이 콜드스타트로 처리된다 —
      # run.py 가 `alerted` 를 통째로 시딩하고 알림은 보내지 않으므로,
      # Berkshire·Citadel 의 과거 수백 건이 Issue 로 쏟아지지 않는다.
      - name: 신규 공시 감지
        id: pipeline
        env:
          FORMS: ${{ inputs.forms || '' }}
          WINDOW: ${{ inputs.alert_window_days || '14' }}
          ENTITIES: ${{ inputs.entities || '' }}
        run: |
          set -uo pipefail
          LIST="${ENTITIES:-$ALL_ENTITIES}"
          USE_FORMS="${FORMS:-$DEFAULT_FORMS}"
          : > "${RUNNER_TEMP}/alerts.tsv"
          : > "${RUNNER_TEMP}/failed.txt"
          for E in $LIST; do
            echo "::group::${E}"
            OUT="${RUNNER_TEMP}/out-${E}.env"
            : > "$OUT"
            if GITHUB_OUTPUT="$OUT" python -m src.pipeline.run \
                 --entity "$E" \
                 --mode incremental \
                 --detect-only \
                 --forms "$USE_FORMS" \
                 --alert-window-days "$WINDOW" \
                 --alert-file "${RUNNER_TEMP}/alert-${E}.md"; then
              ALERT=$(sed -n 's/^alert=//p'       "$OUT" | tail -n1)
              TITLE=$(sed -n 's/^alert_title=//p' "$OUT" | tail -n1)
              if [ "${ALERT:-false}" = "true" ] && [ -n "$TITLE" ]; then
                printf '%s\t%s\n' "$E" "$TITLE" >> "${RUNNER_TEMP}/alerts.tsv"
              fi
            else
              echo "::error::${E} 감지 실패 (다른 엔티티는 계속 처리합니다)"
              echo "$E" >> "${RUNNER_TEMP}/failed.txt"
            fi
            echo "::endgroup::"
          done
          echo "처리 대상: $LIST"
          echo "알림 대기 $(wc -l < "${RUNNER_TEMP}/alerts.tsv")건 / 실패 $(wc -l < "${RUNNER_TEMP}/failed.txt")건"

      # 커밋보다 먼저 알린다. 상태(`alerted`)가 먼저 커밋되면 알림 실패 시
      # 다음 실행에서 그 공시를 다시 감지하지 못해 알림이 유실된다.
      - name: 신규 공시 Issue 생성
        if: always() && steps.pipeline.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          F="${RUNNER_TEMP}/alerts.tsv"
          [ -s "$F" ] || { echo "::notice::신규 공시가 없습니다."; exit 0; }
          # 1차 방어: 상태 파일의 `alerted` 집합 (같은 accession 재알림 없음)
          # 2차 방어: 제목이 동일한 이슈가 이미 있으면 생성하지 않음
          while IFS=$'\t' read -r E T; do
            [ -n "${T:-}" ] || continue
            # gh 의 --jq 는 jq 의 --arg 를 받지 않는다. 제목은 환경변수로 넘겨
            # env.T 로 참조한다(--arg 를 쓰면 gh 가 인자 파싱에서 바로 실패한다).
            # gh 호출은 </dev/null 로 stdin 을 끊는다. 루프가 "$F" 를 stdin 으로
            # 읽는 중이라 gh 가 남은 줄을 삼키면 두 번째 엔티티부터 알림이 사라진다.
            NUM=$(T="$T" gh issue list --state all --limit 200 --json number,title \
                    --jq '.[] | select(.title == env.T) | .number' </dev/null | head -n1)
            if [ -n "$NUM" ]; then
              echo "::notice::[$E] 이미 존재하는 이슈 #$NUM — 새로 만들지 않습니다."
            else
              gh issue create --title "$T" --body-file "${RUNNER_TEMP}/alert-${E}.md" </dev/null
            fi
          done < "$F"

      # fetch-13f 와 같은 상태 파일들을 쓰므로 rebase 충돌이 발생한다.
      # 합집합 병합으로 해소한다(scripts/push_data.sh 주석 참고).
      - name: 상태 변경분 커밋
        if: always() && steps.pipeline.outcome != 'skipped'
        run: |
          scripts/push_data.sh \
            "state(poll): 신규 공시 알림 기록 (run ${GITHUB_RUN_ID})" data/state

      - name: 부분 실패 승격
        if: always() && steps.pipeline.outcome != 'skipped'
        run: |
          set -euo pipefail
          F="${RUNNER_TEMP}/failed.txt"
          if [ -s "$F" ]; then
            echo "::error::실패한 엔티티: $(paste -sd' ' "$F")"
            exit 1
          fi
          echo "모든 엔티티 정상 처리."

      - name: 실패 Issue 생성
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          T: "[FAILURE] ${{ github.workflow }} 워크플로우 실패"
        run: |
          set -euo pipefail
          BODY="${RUNNER_TEMP}/failure.md"
          {
            echo "일간 공시 폴링이 실패했습니다."
            echo
            echo "- 실행 링크: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- 커밋: \`${GITHUB_SHA}\`"
            echo
            if [ -s "${RUNNER_TEMP}/failed.txt" ]; then
              echo "### 실패한 엔티티"
              echo
              while IFS= read -r E; do
                [ -n "$E" ] || continue
                echo "- \`${E}\`"
              done < "${RUNNER_TEMP}/failed.txt"
              echo
            fi
            echo "이 워크플로우 실패는 13F 수집(\`fetch-13f\`)에 영향을 주지 않습니다."
            echo "감지되지 않은 공시는 다음 실행에서 다시 조회됩니다."
          } > "$BODY"
          NUM=$(gh issue list --state open --limit 200 --json number,title \
                  --jq '.[] | select(.title == env.T) | .number' | head -n1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file "$BODY"
          else
            gh issue create --title "$T" --body-file "$BODY"
          fi
