# 13F 수집 파이프라인 (3사: Pershing / Berkshire / Citadel).
#
# 매일 1회 각 엔티티의 submissions API 를 확인하고 신규 13F-HR / 13F-HR/A 만
# 처리한다. "45일째 되는 날 한 번"이 아니라 매일 확인하는 이유: 제출일이 마감
# 45일 이전 임의 시점일 수 있고, 정정 파일링은 언제든 도착하기 때문이다. 신규가
# 없으면 파이프라인이 즉시 exit 0 하므로 러너 시간은 거의 쓰이지 않는다.
#
# 왜 strategy.matrix 가 아니라 단일 잡 루프인가
# ---------------------------------------------
# 매트릭스는 레그를 병렬로 띄운다. 워크플로우 레벨 `concurrency` 는 같은
# 워크플로우 내 매트릭스 레그를 직렬화하지 않으므로, 세 레그가 같은 브랜치에
# 동시에 push 하려고 경합한다(push_data.sh 의 rebase 재시도가 매 실행 돈다).
# 또 SEC 3req/s 제한은 프로세스 단위로만 지켜지므로 병렬 실행은 합산 9req/s 가
# 되어 403 위험이 있다. 체크아웃 1회 · 커밋 1회 · 순차 호출이 모든 면에서 낫다.
#
# 시크릿 0개. SEC 는 연락처(User-Agent)만 요구하며 이는 비밀이 아니므로 env 평문.
name: fetch-13f

on:
  schedule:
    # 매일 UTC 21:00
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      entities:
        description: "처리할 엔티티 (공백 구분). 비우면 전체"
        type: string
        default: ""
      mode:
        description: "실행 모드"
        type: choice
        default: incremental
        options: [incremental, backfill, events-only]
      limit:
        description: "backfill 시 처리할 파일링 개수 상한 (비우면 전량)"
        type: string
        default: ""
      force_rebuild:
        description: "데이터 변경이 없어도 대시보드를 강제 재빌드"
        type: boolean
        default: false

permissions:
  contents: write   # data/*.jsonl 커밋
  issues: write     # 실패 / STRONG 이벤트 알림 (별도 알림 인프라 없음)
  actions: write    # build-dashboard 워크플로우 디스패치 (아래 주석 참고)

# 같은 리포지토리에 커밋하는 워크플로우끼리 그룹을 공유해 push 경합을 차단한다.
concurrency:
  group: ackman-tracker-data
  cancel-in-progress: false

env:
  # SEC 필수 헤더. 없으면 403. 비밀이 아니므로 시크릿을 쓰지 않는다.
  SEC_USER_AGENT: "AckmanTracker younggil jinhae8971@gmail.com"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  # 순서는 src/common/entities.py 의 ORDER 와 같다 (대시보드 사이드탭 순서).
  ALL_ENTITIES: "pershing berkshire citadel"

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 3사 순차 처리. Citadel 은 분기당 7.85MB 원문을 받으므로 전량 backfill 시
    # 가장 오래 걸린다. incremental 은 통상 2~3분.
    timeout-minutes: 180
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: python -m pip install --upgrade pip requests

      # 엔티티 하나가 실패해도 나머지는 계속 처리한다. 성공한 엔티티의 데이터를
      # 버리고 내일 다시 받는 것은 낭비이고, run.py 는 무결성 게이트를 통과한
      # 엔티티의 상태만 갱신하므로 실패한 엔티티는 다음 실행에서 자동 재시도된다.
      # 다만 실패 사실을 삼키지는 않는다 — 뒤의 '부분 실패 승격' 스텝이 잡을 실패시킨다.
      - name: 파이프라인 실행
        id: pipeline
        env:
          MODE: ${{ inputs.mode || 'incremental' }}
          LIMIT: ${{ inputs.limit || '' }}
          ENTITIES: ${{ inputs.entities || '' }}
        run: |
          set -uo pipefail
          LIST="${ENTITIES:-$ALL_ENTITIES}"
          : > "${RUNNER_TEMP}/alerts.tsv"
          : > "${RUNNER_TEMP}/failed.txt"
          for E in $LIST; do
            echo "::group::${E} (${MODE})"
            ARGS=(--entity "$E" --mode "$MODE" --alert-file "${RUNNER_TEMP}/alert-${E}.md")
            [ -n "$LIMIT" ] && ARGS+=(--limit "$LIMIT")
            OUT="${RUNNER_TEMP}/out-${E}.env"
            : > "$OUT"
            # run.py 의 set_output 을 엔티티별 파일로 격리한다. 한 스텝에서 세 번
            # 호출하면 GITHUB_OUTPUT 에 같은 키가 3번 쌓여 마지막 값만 살아남는다.
            if GITHUB_OUTPUT="$OUT" python -m src.pipeline.run "${ARGS[@]}"; then
              ALERT=$(sed -n 's/^alert=//p'          "$OUT" | tail -n1)
              STRONG=$(sed -n 's/^strong_events=//p' "$OUT" | tail -n1)
              TITLE=$(sed -n 's/^alert_title=//p'    "$OUT" | tail -n1)
              if [ "${ALERT:-false}" = "true" ] && [ "${STRONG:-0}" != "0" ] && [ -n "$TITLE" ]; then
                printf '%s\t%s\n' "$E" "$TITLE" >> "${RUNNER_TEMP}/alerts.tsv"
              fi
            else
              echo "::error::${E} 파이프라인 실패 (다른 엔티티는 계속 처리합니다)"
              echo "$E" >> "${RUNNER_TEMP}/failed.txt"
            fi
            echo "::endgroup::"
          done
          echo "처리 대상: $LIST"
          echo "알림 대기 $(wc -l < "${RUNNER_TEMP}/alerts.tsv")건 / 실패 $(wc -l < "${RUNNER_TEMP}/failed.txt")건"

      # 알림을 커밋보다 먼저 보낸다. 커밋이 끝나면 다음 실행에서 "신규 없음"으로
      # 조기 종료하므로, 커밋 후에 알림이 실패하면 그 알림은 영원히 유실된다.
      - name: STRONG 이벤트 Issue 생성
        if: always() && steps.pipeline.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          F="${RUNNER_TEMP}/alerts.tsv"
          [ -s "$F" ] || { echo "::notice::알릴 STRONG 이벤트가 없습니다."; exit 0; }
          # 제목은 엔티티·분기별로 결정적이다(notify.py 가 [STRONG][표기명] 접두를 붙인다).
          # open/closed 를 모두 조회하므로 같은 분기에 대해 매일 다시 생기지 않는다.
          while IFS=$'\t' read -r E T; do
            [ -n "${T:-}" ] || continue
            NUM=$(gh issue list --state all --limit 200 --json number,title \
                    --jq --arg t "$T" '.[] | select(.title == $t) | .number' | head -n1)
            if [ -n "$NUM" ]; then
              echo "::notice::[$E] 이미 존재하는 이슈 #$NUM — 새로 만들지 않습니다."
            else
              gh issue create --title "$T" --body-file "${RUNNER_TEMP}/alert-${E}.md"
            fi
          done < "$F"

      - name: 데이터 변경분 커밋
        id: commit
        if: always() && steps.pipeline.outcome != 'skipped'
        run: |
          scripts/push_data.sh \
            "data(13f): 파이프라인 자동 갱신 (run ${GITHUB_RUN_ID})" data

      # GITHUB_TOKEN 으로 만든 push 는 다른 워크플로우의 `push` 이벤트를
      # 트리거하지 않는다(GitHub 의 재귀 실행 방지 정책). 즉 이 단계가 없으면
      # 데이터가 갱신돼도 build-dashboard 가 영원히 돌지 않아 대시보드가
      # 과거 데이터에 멈춘다. `workflow_dispatch` 는 GITHUB_TOKEN 으로도
      # 항상 실행되므로 명시적으로 디스패치한다.
      #
      # 조건에 `committed` 가 아니라 `normalized_changed` 를 쓰는 이유:
      # 상태 파일의 `last_run` 은 매 실행 바뀌어 `committed` 가 항상 true 다.
      - name: 대시보드 재빌드 트리거
        if: always() && (steps.commit.outputs.normalized_changed == 'true' || inputs.force_rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-dashboard.yml --ref "${GITHUB_REF_NAME}"
          echo "::notice::대시보드 재빌드를 요청했습니다 (normalized_changed=${{ steps.commit.outputs.normalized_changed }}, force=${{ inputs.force_rebuild }})."

      # 부분 실패를 여기서 비로소 잡 실패로 승격한다. 성공한 엔티티의 커밋과
      # 대시보드 재빌드는 이미 끝난 뒤이므로 진척은 보존되고, 실패는 아래
      # `failure()` 스텝을 통해 Issue 로 드러난다.
      - name: 부분 실패 승격
        if: always() && steps.pipeline.outcome != 'skipped'
        run: |
          set -euo pipefail
          F="${RUNNER_TEMP}/failed.txt"
          if [ -s "$F" ]; then
            echo "::error::실패한 엔티티: $(paste -sd' ' "$F")"
            exit 1
          fi
          echo "모든 엔티티 정상 처리."

      - name: 실패 Issue 생성
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          T: "[FAILURE] ${{ github.workflow }} 워크플로우 실패"
        run: |
          set -euo pipefail
          BODY="${RUNNER_TEMP}/failure.md"
          {
            echo "13F 수집 파이프라인이 실패했습니다."
            echo
            echo "- 워크플로우: \`${GITHUB_WORKFLOW}\`"
            echo "- 실행 링크: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- 커밋: \`${GITHUB_SHA}\`"
            echo
            if [ -s "${RUNNER_TEMP}/failed.txt" ]; then
              echo "### 실패한 엔티티"
              echo
              while IFS= read -r E; do
                [ -n "$E" ] || continue
                echo "- \`${E}\`"
              done < "${RUNNER_TEMP}/failed.txt"
              echo
              echo "나머지 엔티티는 정상 처리되어 커밋되었습니다."
              echo "\`data/state/{entity}.json\` 은 무결성 게이트 통과 시에만 갱신되므로"
              echo "실패한 엔티티는 다음 실행에서 자동 재시도됩니다."
            else
              echo "엔티티 루프 이전 단계(체크아웃·의존성) 또는 커밋·디스패치 단계에서"
              echo "실패했을 수 있습니다. 실행 링크의 스텝별 로그를 확인하세요."
            fi
          } > "$BODY"
          # 열린 동일 제목 이슈가 있으면 코멘트만 달아 매일 중복 생성되는 것을 막는다.
          NUM=$(gh issue list --state open --limit 200 --json number,title \
                  --jq '.[] | select(.title == env.T) | .number' | head -n1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file "$BODY"
          else
            gh issue create --title "$T" --body-file "$BODY"
          fi
