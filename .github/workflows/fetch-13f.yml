# 13F 수집 파이프라인.
#
# 매일 1회 submissions API(118KB)를 확인하고 신규 13F-HR / 13F-HR/A 만 처리한다.
# "45일째 되는 날 한 번"이 아니라 매일 확인하는 이유: 제출일이 마감 45일 이전
# 임의 시점일 수 있고, 정정 파일링은 언제든 도착하기 때문이다. 신규가 없으면
# 파이프라인이 즉시 exit 0 하므로 러너 시간은 거의 쓰이지 않는다.
#
# 시크릿 0개. SEC 는 연락처(User-Agent)만 요구하며 이는 비밀이 아니므로 env 평문.
name: fetch-13f

on:
  schedule:
    # 매일 UTC 21:00
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        default: incremental
        options: [incremental, backfill, events-only]
      limit:
        description: "backfill 시 처리할 파일링 개수 상한 (비우면 전량)"
        type: string
        default: ""
      force_rebuild:
        description: "데이터 변경이 없어도 대시보드를 강제 재빌드"
        type: boolean
        default: false

permissions:
  contents: write   # data/*.jsonl 커밋
  issues: write     # 실패 / STRONG 이벤트 알림 (별도 알림 인프라 없음)
  actions: write    # build-dashboard 워크플로우 디스패치 (아래 주석 참고)

# 같은 리포지토리에 커밋하는 워크플로우끼리 그룹을 공유해 push 경합을 차단한다.
concurrency:
  group: ackman-tracker-data
  cancel-in-progress: false

env:
  # SEC 필수 헤더. 없으면 403. 비밀이 아니므로 시크릿을 쓰지 않는다.
  SEC_USER_AGENT: "AckmanTracker younggil jinhae8971@gmail.com"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    # SEC 자체 제한 3req/s + OpenFIGI 분당 25요청 -> 전량 backfill 여유 확보
    timeout-minutes: 90
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: python -m pip install --upgrade pip requests

      - name: 파이프라인 실행
        id: pipeline
        env:
          ALERT_FILE: ${{ runner.temp }}/alert.md
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode || 'incremental' }}"
          ARGS=(--mode "$MODE" --alert-file "$ALERT_FILE")
          if [ -n "${{ inputs.limit || '' }}" ]; then
            ARGS+=(--limit "${{ inputs.limit }}")
          fi
          python -m src.pipeline.run "${ARGS[@]}"

      # 알림을 커밋보다 먼저 보낸다. 커밋이 끝나면 다음 실행에서 "신규 없음"으로
      # 조기 종료하므로, 커밋 후에 알림이 실패하면 그 알림은 영원히 유실된다.
      - name: STRONG 이벤트 Issue 생성
        if: steps.pipeline.outputs.alert == 'true' && steps.pipeline.outputs.strong_events != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          T: ${{ steps.pipeline.outputs.alert_title }}
          BODY: ${{ runner.temp }}/alert.md
        run: |
          set -euo pipefail
          # 제목은 분기별로 결정적이다. open/closed 를 모두 조회하므로
          # 같은 분기에 대해 매일 이슈가 다시 생기지 않는다.
          NUM=$(gh issue list --state all --limit 200 --json number,title \
                  --jq '.[] | select(.title == env.T) | .number' | head -n1)
          if [ -n "$NUM" ]; then
            echo "::notice::이미 존재하는 이슈 #$NUM — 새로 만들지 않습니다."
          else
            gh issue create --title "$T" --body-file "$BODY"
          fi

      - name: 데이터 변경분 커밋
        id: commit
        run: |
          scripts/push_data.sh \
            "data(13f): 파이프라인 자동 갱신 (run ${GITHUB_RUN_ID})" data

      # GITHUB_TOKEN 으로 만든 push 는 다른 워크플로우의 `push` 이벤트를
      # 트리거하지 않는다(GitHub 의 재귀 실행 방지 정책). 즉 이 단계가 없으면
      # 데이터가 갱신돼도 build-dashboard 가 영원히 돌지 않아 대시보드가
      # 과거 데이터에 멈춘다. `workflow_dispatch` 는 GITHUB_TOKEN 으로도
      # 항상 실행되므로 명시적으로 디스패치한다.
      #
      # 조건에 `committed` 가 아니라 `normalized_changed` 를 쓰는 이유:
      # 상태 파일의 `last_run` 은 매 실행 바뀌어 `committed` 가 항상 true 다.
      - name: 대시보드 재빌드 트리거
        if: steps.commit.outputs.normalized_changed == 'true' || inputs.force_rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-dashboard.yml --ref "${GITHUB_REF_NAME}"
          echo "::notice::대시보드 재빌드를 요청했습니다 (normalized_changed=${{ steps.commit.outputs.normalized_changed }}, force=${{ inputs.force_rebuild }})."

      - name: 실패 Issue 생성
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          T: "[FAILURE] ${{ github.workflow }} 워크플로우 실패"
          ALERT: ${{ runner.temp }}/alert.md
          FALLBACK: ${{ runner.temp }}/failure.md
        run: |
          set -euo pipefail
          if [ -f "$ALERT" ]; then
            BODY="$ALERT"
          else
            {
              echo "파이프라인이 실패했습니다. 데이터는 커밋되지 않았습니다."
              echo
              echo "- 워크플로우: \`${GITHUB_WORKFLOW}\`"
              echo "- 실행 링크: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- 커밋: \`${GITHUB_SHA}\`"
              echo
              echo "무결성 게이트 이전 단계(체크아웃·의존성·EDGAR 접근)에서 실패했을 수 있습니다."
              echo "\`data/state/last_seen.json\` 은 게이트 통과 시에만 갱신되므로 다음 실행에서 자동 재시도됩니다."
            } > "$FALLBACK"
            BODY="$FALLBACK"
          fi
          # 열린 동일 제목 이슈가 있으면 코멘트만 달아 매일 중복 생성되는 것을 막는다.
          NUM=$(gh issue list --state open --limit 200 --json number,title \
                  --jq '.[] | select(.title == env.T) | .number' | head -n1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file "$BODY"
          else
            gh issue create --title "$T" --body-file "$BODY"
          fi
